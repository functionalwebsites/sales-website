<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="hb-art-title hb-art-desc">
<title id="hb-art-title">Surf City: a love letter to Huntington Beach</title><desc id="hb-art-desc">An original paper-and-ink illustration of Huntington Beach Pier with a warm sunset, moving ocean waves, seabirds, and Surf City lettering.</desc>
<style>
.hb-wave{animation:hb-swell 4s ease-in-out 1}.hb-wave-back{animation-delay:.2s}.hb-bird{animation:hb-flight 4s ease-in-out 1}.hb-pier{animation:hb-arrive 1.5s ease-out 1}
@keyframes hb-swell{0%,100%{transform:translateX(0)}35%{transform:translateX(-12px)}70%{transform:translateX(10px)}}
@keyframes hb-flight{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-7px)}}
@keyframes hb-arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.hb-wave,.hb-bird,.hb-pier{animation:none}}
</style>
